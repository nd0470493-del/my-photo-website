<!DOCTYPE html>
<html>
<head>
    <title>My Photo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 25px;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);

            /* फोटो को हिलाने की animation */
            animation: movePhoto 3s ease-in-out infinite;
        }

        @keyframes movePhoto {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(10px, -10px);
            }

            50% {
                transform: translate(0, 10px);
            }

            75% {
                transform: translate(-10px, -10px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Website</h1>
    <p>Welcome to my website!</p>

    <img src="IMG_20260823_082540.jpg" alt="My Photo">

</body>
</html>
