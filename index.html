<!DOCTYPE html>
<html>
<head>
    <title>My Photo</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .card {
            text-align: center;
            padding: 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .top-text {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        img {
            width: 220px;
            height: 220px;
            object-fit: cover;
            border-radius: 50%;

            border: 8px solid white;
            box-shadow:
                0 0 10px #00ffff,
                0 0 25px #00ffff,
                0 0 45px #ff00ff;

            animation: float 3s ease-in-out infinite;
        }

        .bottom-text {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        .small-text {
            margin-top: 8px;
            font-size: 15px;
        }

        @keyframes float {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(8px, -8px);
            }

            50% {
                transform: translate(0, 8px);
            }

            75% {
                transform: translate(-8px, -8px);
            }

            100% {
                transform: translate(0, 0);
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="top-text">
            ✨ WELCOME TO MY WORLD ✨
        </div>

        <img src="IMG_20260823_082540.jpg" alt="My Photo">

        <div class="bottom-text">
            💫 My Beautiful Photo 💫
        </div>

        <div class="small-text">
            ⭐ Keep Smiling • Keep Shining ⭐
        </div>

    </div>

</body>
</html>
